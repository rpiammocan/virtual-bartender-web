name: Deploy web test

on:
  push:
    branches:
      - main
      - agent/browser-native-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Refresh canonical catalog and recipe images
        run: python3 tools/generate_catalog.py --sync-images public/media

      - name: Build
        run: npm run build

      - name: Add Offline Game Room
        run: |
          cat game-room-payload/payload-00.b64 \
              game-room-payload/payload-01.b64 \
              game-room-payload/payload-02.b64 \
              game-room-payload/payload-03.b64 \
              game-room-payload/payload-04.b64 \
              game-room-payload/payload-05.b64 \
              game-room-payload/payload-06.b64 \
              game-room-payload/tail-00.b64 \
              game-room-payload/tail-01.b64 \
              game-room-payload/tail-02.b64 \
              game-room-payload/tail-03.b64 \
              game-room-payload/tail-04.b64 \
              | base64 --decode > /tmp/offline-game-room.zip
          unzip -t /tmp/offline-game-room.zip
          rm -rf /tmp/offline-game-room dist/offline-game-room
          mkdir -p /tmp/offline-game-room dist/offline-game-room
          unzip -q /tmp/offline-game-room.zip -d /tmp/offline-game-room
          cp -a /tmp/offline-game-room/Offline-Game-Room-v0.16.0/. dist/offline-game-room/
          test -f dist/offline-game-room/index.html
          test -f dist/offline-game-room/manifest.webmanifest
          test -f dist/offline-game-room/sw.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
