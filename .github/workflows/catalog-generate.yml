name: Generate catalog

on:
  push:
    branches:
      - agent/browser-native-v1
    paths:
      - 'tools/generate_catalog.py'
      - '.github/workflows/catalog-generate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-native-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate catalog
        run: python tools/generate_catalog.py
      - name: Commit generated catalog
        run: |
          if [ -z "$(git status --porcelain -- src/catalog/generatedCatalog.ts)" ]; then
            echo 'Generated catalog is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/catalog/generatedCatalog.ts
          git commit -m 'Generate canonical browser recipe catalog'
          git push origin HEAD:agent/browser-native-v1
